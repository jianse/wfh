[package]
name = "service"
version = "0.1.0"
edition = "2024"

[features]
embed = ["spa/embed"]

[dependencies]
settings = { path = "../settings" }
spa = { path = "../spa" }

axum = { workspace = true, features = ["macros", "http2"] }
chrono = { workspace = true }
config = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex = { workspace = true, default-features = false }
sea-orm = { workspace = true, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
sea-orm-migration = { workspace = true, features = ["sqlx-sqlite"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "local-time",
] }
tokio-rustls = { workspace = true, default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
axum-server = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }
tracing-appender = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
reqwest = { workspace = true, default-features = false, features = [
    "charset",
    "http2",
    "rustls-tls-native-roots",
    "gzip",
    "json",
] }
md5 = { workspace = true }
hex = { workspace = true }
serde_with = { workspace = true, features = ["chrono_0_4"] }
serde_path_to_error = { workspace = true }
async-compression = { workspace = true, features = ["brotli", "tokio"] }
async-trait = { workspace = true }


[dev-dependencies]
axum-server = { workspace = true, features = ["tls-rustls"] }
eyre = { workspace = true }
