[workspace]
resolver = "2"
members = ["api", "settings", "spa", "service", "migration", "export", "acme"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = { git = "https://github.com/tokio-rs/axum.git" }
axum-extra = { git = "https://github.com/tokio-rs/axum.git" }
chrono = "0.4.45"
config = "0.15.23"
http = "1.4.1"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
log = "0.4.32"
once_cell = "1.21.4"
rand = "0.10.1"
regex = { version = "1.12.3", default-features = false }
sea-orm = "1.1.20"
serde = "1.0.228"
serde_json = "1.0.150"
sea-orm-migration = "1.1.20"
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-rustls = "0.26.4"
tower-http = "0.6.11"
tracing-appender = "0.2.5"
bcrypt = "0.19.1"
argon2 = "0.5.3"
serde_with = "3.21.0"
rust-embed = "8.11.0"
mime_guess = "2.0.5"
hex = "0.4.3"
clap = "4.6.1"
eyre = "0.6.12"
toml = "1.1.2"
md5 = "0.8.0"
uuid = "1.23.2"
reqwest = { version = "0.13.4", default-features = false, features = [
    "default-tls",
    "http2",
] }
serde_path_to_error = "0.1.20"
async-compression = "0.4.42"
async-trait = "0.1.89"
async-std = "1.13.2"
serde_ignored = "0.1.14"
indexmap = "2.14.0"
strsim = "0.11.1"
rustls = { version = "0.23.40", default-features = false }
tower = "0.5.3"
time = "0.3.47"
base64 = "0.22.1"
ua-parser = "0.2.2"
serde_yaml = "0.9.34"


# dev use only
criterion = "0.8.2"
