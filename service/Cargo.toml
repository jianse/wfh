[package]
name = "service"
version = "0.1.0"
edition = "2024"

[features]
embed = ["spa/embed"]

[dependencies]
settings = { path = "../settings" }
spa = { path = "../spa" }
migration = { path = "../migration" }
acme = { path = "../acme" }

axum = { workspace = true, features = ["macros", "http2", "multipart"] }
chrono = { workspace = true }
config = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true, default-features = false, features = [
    # "std",
    # "unicode",
] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "local-time",
    # "chrono",
] }
tokio-rustls = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }
tracing-appender = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
reqwest = { workspace = true, features = ["charset", "http2", "gzip", "json"] }
md5 = { workspace = true }
hex = { workspace = true }
serde_with = { workspace = true, features = ["chrono_0_4"] }
serde_path_to_error = { workspace = true }
async-compression = { workspace = true, features = ["brotli", "tokio"] }
async-trait = { workspace = true }
serde_ignored = { workspace = true }
export = { path = "../export" }
rustls.workspace = true
time = { workspace = true, features = ["formatting"] }
indexmap = { workspace = true, features = ["serde"] }
rand.workspace = true
base64.workspace = true
ua-parser.workspace = true
axum-extra = { features = ["cookie", "typed-header"], workspace = true }
serde_yaml.workspace = true
pkcs8 = { version = "0.11.0", features = ["alloc", "pem"] }
bon = "3.10.1"


[dev-dependencies]
# axum-client-ip.workspace = true
eyre = { workspace = true }
