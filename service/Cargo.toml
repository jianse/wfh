[package]
name = "service"
version = "0.1.0"
edition = "2024"

[features]
embed = ["spa/embed"]

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.4", features = ["macros"] }
bcrypt = "0.17.0"
chrono = "0.4.41"
config = "0.15.11"
http = "1.3.1"
jsonwebtoken = "9.3.1"
log = "0.4.27"
once_cell = "1.21.3"
rand = "0.9.1"
regex = { version = "1.11.1", default-features = false }
sea-orm = { version = "1.1.12", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = "1.1.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "local-time"] }
settings = {path = "../settings"}
spa = {path = "../spa"}

[dev-dependencies]
eyre = "0.6.12"