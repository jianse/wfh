[workspace]
resolver = "2"
members = ["api", "settings", "spa", "service", "migration", "export"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = { git = "https://github.com/tokio-rs/axum.git", rev = "2df78b7"}
chrono = "0.4.43"
config = "0.15.19"
http = "1.4.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
log = "0.4.29"
once_cell = "1.21.3"
rand = "0.9.2"
regex = { version = "1.12.2", default-features = false }
sea-orm = "1.1.19"
serde = "1.0.228"
serde_json = "1.0.149"
sea-orm-migration = "1.1.19"
thiserror = "2.0.18"
tokio = "1.49.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tokio-rustls = "0.26.4"
tower-http = "0.6.8"
tracing-appender = "0.2.4"
bcrypt = "0.18.0"
argon2 = "0.5.3"
serde_with = "3.16.1"
rust-embed = "8.11.0"
mime_guess = "2.0.5"
hex = "0.4.3"
clap = "4.5.56"
eyre = "0.6.12"
toml = "0.9.11"
md5 = "0.8.0"
uuid = "1.20.0"
reqwest = { version = "0.13.1", default-features = false, features = [
    "default-tls",
    "http2",
] }
serde_path_to_error = "0.1.20"
async-compression = "0.4.37"
async-trait = "0.1.89"
async-std = "1.13.2"
serde_ignored = "0.1.14"
indexmap = "2.13.0"
strsim = "0.11.1"
rustls = { version = "0.23.36", default-features = false }
tower = "0.5.3"
sqlx = {version = "0.8.6", features = ["runtime-tokio","tls-rustls-aws-lc-rs"]}
time = "0.3.46"


# dev use only
criterion = "0.8.1"
