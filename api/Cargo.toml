[package]
name = "wf_api"
version = "0.1.0"
edition = "2024"

[features]
embed = ["service/embed"]

[dependencies]
migration = { path = "../migration" }
service = { path = "../service" }
settings = { path = "../settings" }

tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive"] }
toml = { workspace = true }
eyre = { workspace = true }
sea-orm = { workspace = true, features = [
    "sqlx-sqlite",
    "runtime-tokio"
] }
