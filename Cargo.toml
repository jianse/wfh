[workspace]
resolver = "2"
members = ["api", "settings", "spa", "service", "migration"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8.4"
chrono = "0.4.42"
config = "0.15.16"
http = "1.3.1"
jsonwebtoken = "9.3.1"
log = "0.4.28"
once_cell = "1.21.3"
rand = "0.9.2"
regex = { version = "1.11.2", default-features = false }
sea-orm = "1.1.16"
serde = "1.0.225"
serde_json = "1.0.145"
sea-orm-migration = "1.1.16"
thiserror = "2.0.16"
tokio = "1.47.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tokio-rustls = { version = "0.26.3", default-features = false }
tower-http = "0.6.6"
tracing-appender = "0.2.3"
bcrypt = "0.17.1"
argon2 = "0.5.3"
serde_with = "3.14.0"
rust-embed = "8.7.2"
mime_guess = "2.0.5"
hex = "0.4.3"
clap = "4.5.47"
eyre = "0.6.12"
toml = "0.9.7"
md5 = "0.8.0"
uuid = "1.18.1"
reqwest = { version = "0.12.23", default-features = false }
serde_path_to_error = "0.1.20"
async-compression = "0.4.30"
async-trait = "0.1.89"
async-std = "1.13.2"
serde_ignored = "0.1.14"

# dev use only
criterion = "0.7.0"
