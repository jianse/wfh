# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build

on: [push, pull_request]

jobs:
  build_ui:
    defaults:
      run:
        working-directory: ui
    runs-on: ubuntu-latest

    # strategy:
    #   matrix:
    #     node-version: [18.x, 20.x, 22.x]
    # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"
          cache-dependency-path: "ui/pnpm-lock.yaml"

      - uses: actions/cache@v4
        with:
          path: ui/cache
          key: data-cache

      - run: pnpm install
      - run: pnpm run build
        env:
          DATA_PROXY: ${{ secrets.DATA_PROXY }}

      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: ui/dist

  build_api:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo }}

      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: wfh-api-${{ matrix.target }}
          path: |
            target/release/wf_api
            target/release/wf_api.exe

  build_app_bundle:
    needs: build_ui
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-embed }}

      - run: rustup target add ${{ matrix.target }}
        name: Adding target

      - name: Download ui from 'build_ui' job
        uses: actions/download-artifact@v4
        with:
          name: ui
          path: ui/dist

      - run: cargo build --release --features=embed

      - uses: actions/upload-artifact@v4
        with:
          name: wfh-${{ matrix.target }}
          path: |
            target/release/wf_api
            target/release/wf_api.exe
