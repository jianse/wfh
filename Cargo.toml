[workspace]
resolver = "2"
members = ["api", "settings", "spa", "service", "migration", "export", "acme", "wf_cache"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = { git = "https://github.com/tokio-rs/axum.git" }
axum-extra = { git = "https://github.com/tokio-rs/axum.git" }
chrono = "0.4.45"
config = "0.15.25"
http = "1.5.0"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
log = "0.4.34"
once_cell = "1.21.4"
rand = "0.10.3"
regex = { version = "1.12.4", default-features = false }
sea-orm = "2.0.3"
serde = "1.0.229"
serde_json = "1.0.151"
sea-orm-migration = "2.0.3"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-rustls = "0.26.5"
tower-http = "0.7.1"
tracing-appender = "0.2.5"
bcrypt = "0.19.2"
argon2 = "0.6.0"
serde_with = "3.23.0"
rust-embed = "8.12.0"
mime_guess = "2.0.5"
hex = "0.4.3"
clap = "4.6.7"
eyre = "0.6.14"
toml = "1.1.6"
md5 = "0.8.1"
uuid = "1.26.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "default-tls",
    "http2",
] }
serde_path_to_error = "0.1.20"
async-compression = "0.4.48"
async-trait = "0.1.92"
async-std = "1.13.2"
serde_ignored = "0.1.14"
indexmap = "2.14.2"
strsim = "0.11.1"
rustls = { version = "0.23.45", default-features = false }
tower = "0.5.3"
time = "0.3.55"
base64 = "0.23.1"
ua-parser = "0.2.2"
serde_yaml = "0.9.34"


# dev use only
criterion = "0.8.2"
