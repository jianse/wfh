[workspace]
resolver = "2"
members = ["api", "settings", "spa", "service", "migration", "export"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8.7"
chrono = "0.4.42"
config = "0.15.19"
http = "1.4.0"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
log = "0.4.29"
once_cell = "1.21.3"
rand = "0.9.2"
regex = { version = "1.12.2", default-features = false }
sea-orm = "1.1.19"
serde = "1.0.228"
serde_json = "1.0.145"
sea-orm-migration = "1.1.19"
thiserror = "2.0.17"
tokio = "1.48.0"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
tokio-rustls = { version = "0.26.4", default-features = false }
tower-http = "0.6.8"
tracing-appender = "0.2.4"
bcrypt = "0.17.1"
argon2 = "0.5.3"
serde_with = "3.16.1"
rust-embed = "8.9.0"
mime_guess = "2.0.5"
hex = "0.4.3"
clap = "4.5.53"
eyre = "0.6.12"
toml = "0.9.8"
md5 = "0.8.0"
uuid = "1.19.0"
reqwest = { version = "0.12.25", default-features = false }
serde_path_to_error = "0.1.20"
async-compression = "0.4.36"
async-trait = "0.1.89"
async-std = "1.13.2"
serde_ignored = "0.1.14"
indexmap = "2.12.1"
strsim = "0.11.1"

# dev use only
criterion = "0.8.1"
