[package]
name = "spa"
version = "0.1.0"
edition = "2024"

[features]
embed = ["dep:rust-embed", "dep:hex", "dep:chrono", "dep:mime_guess"]

[dependencies]
axum = "0.8.4"
rust-embed = { version = "8.7.2", features = ["mime-guess", "compression"], optional = true }
tower-http = { version = "0.6.6", features = ["fs"] }
hex = { version = "0.4.3", optional = true }
settings = { path = "../settings" }
tracing = "0.1.41"
mime_guess = { version = "2.0.5", optional = true }
chrono = { version = "0.4.41", optional = true }

#argon2 = { version = "0.5.3", features = ["std"] }
#axum = { version = "0.8.4", features = ["macros"] }
#bcrypt = "0.17.0"

#config = "0.15.11"
#hex = "0.4.3"
#jsonwebtoken = "9.3.1"
#log = "0.4.27"
#mime_guess = "2.0.5"
#once_cell = "1.21.3"
#rand = "0.9.1"
#regex = "1.11.1"
#rust-embed = { version = "8.7.2", features = ["mime-guess"] }
#sea-orm = { version = "1.1.11", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
#sea-orm-migration = "1.1.11"
#serde = { version = "1.0.219", features = ["derive"] }
#serde_json = "1.0.140"
#thiserror = "2.0.12"
#tokio = { version = "1.45.0", features = ["full"] }
#tower = "0.5.2"
#tracing = "0.1.41"
#tracing-subscriber = { version = "0.3.19", features = ["env-filter", "local-time"] }
