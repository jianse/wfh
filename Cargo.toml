[workspace]
resolver = "2"
members = ["api", "settings", "spa", "service", "api"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8.4"
chrono = "0.4.41"
config = "0.15.13"
http = "1.3.1"
jsonwebtoken = "9.3.1"
log = "0.4.27"
once_cell = "1.21.3"
rand = "0.9.2"
regex = { version = "1.11.1", default-features = false }
sea-orm = "1.1.14"
serde = "1.0.219"
serde_json = "1.0.142"
sea-orm-migration = "1.1.14"
thiserror = "2.0.12"
tokio = "1.47.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tokio-rustls = { version = "0.26.2", default-features = false }
axum-server = "0.7.2"
tower-http = "0.6.6"
tracing-appender = "0.2.3"
bcrypt = "0.17.0"
argon2 = "0.5.3"
serde_with = "3.14.0"
rust-embed = "8.7.2"
mime_guess = "2.0.5"
hex = "0.4.3"
clap = "4.5.42"
eyre = "0.6.12"
toml = "0.9.4"
md5 = "0.8.0"
uuid = "1.17.0"
reqwest = { version = "0.12.22", default-features = false }

# dev use only
criterion = "0.7.0"
